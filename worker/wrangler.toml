name = "waivy-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ── Cross-device sync (web ⇄ iPhone) ─────────────────────────────────────────
# /sync/pull and /sync/push store each anonymous "sync code"'s user data
# (pantry, grocery, saved, custom recipes, the Nourish diary, …) in this KV
# namespace so an edit on the website appears on the phone and vice-versa.
# Create it once, paste the printed id below, then redeploy:
#
#   wrangler kv namespace create WAIVY_SYNC
#   # → copy the id into `id` here, then `wrangler deploy`
#
# Sync degrades gracefully: if the binding is missing the routes return 503 and
# both apps keep working fully (local-only).
[[kv_namespaces]]
binding = "SYNC"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# ── Cheap recipe-image generation (Workers AI FLUX-1-schnell) ────────────────
# /generate-recipe-image prefers Cloudflare Workers AI (~$0.0001/image, with a
# daily free Neuron allotment) over OpenAI dall-e/gpt-image (~$0.04). Enabling
# the binding needs no id — Workers AI is account-level. Absent → OpenAI is used.
[ai]
binding = "AI"

# ── Generated-image cache (R2) ───────────────────────────────────────────────
# Each unique recipe prompt is generated once and stored here by SHA-256 hash,
# then served from /recipe-image/<hash> (CDN-immutable) to every user/device —
# so popular/repeat recipes cost $0. Create the bucket once, then redeploy:
#
#   wrangler r2 bucket create waivy-recipe-images
#
# Absent → images are returned inline as base64 (today's behavior).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "waivy-recipe-images"

# OPENAI_API_KEY and ALLOWED_ORIGIN are stored as worker secrets:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ALLOWED_ORIGIN  (e.g. https://justinsuo.github.io)

# Model overrides are plain [vars] — change in code or via:
#   wrangler secret put RECIPE_MODEL
# All overrides are optional. Defaults pick real, available OpenAI models.

[vars]
# Text models. Aliases (no dated snapshots) so OpenAI auto-resolves to the
# latest version. Override per-task to use bigger / cheaper models without
# changing code.
#
# Defaults pinned to gpt-4o-mini. Tried gpt-5-nano (cheapest GPT-5) but its
# hidden reasoning tokens add ~25s per call and it doesn't reliably follow
# the recipe JSON schema (returns "quantity":"2 cups" instead of separate
# {quantity:<number>, unit, estimatedCost} fields), which crashes the UI.
# gpt-4o-mini: ~5s, strict JSON, ~$0.15/1M in / $0.60/1M out — still cheap.
DEFAULT_TEXT_MODEL = "gpt-4o-mini"
RECIPE_MODEL = "gpt-4o-mini"
RECIPE_HIGH_QUALITY_MODEL = "gpt-4o-mini"
LIGHTWEIGHT_MODEL = "gpt-4o-mini"
PRICING_MODEL = "gpt-4o-mini"
INGREDIENT_MODEL = "gpt-4o-mini"
WEB_RECIPE_MODEL = "gpt-4o-mini"

# Image models. dall-e-3 was deprecated by OpenAI ("model does not exist"
# on this org as of 2026), so primary is gpt-image-1 (current model, ~$0.04
# per 1024px image). Some orgs require phone-verification to enable it; on
# those accounts dall-e-2 is the safe last-resort fallback.
DEFAULT_IMAGE_MODEL = "gpt-image-1"
IMAGE_MODEL_FALLBACK = "dall-e-2"

# Text-to-speech (premium guided-cooking voice via POST /tts). gpt-4o-mini-tts
# is OpenAI's current steerable speech model and accepts an `instructions`
# field to shape tone. Swap to tts-1 (cheaper) or tts-1-hd (higher fidelity)
# here without code changes. nova is warm + clear; alloy is a neutral default.
TTS_MODEL = "gpt-4o-mini-tts"
TTS_DEFAULT_VOICE = "nova"
